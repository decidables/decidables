# Fonts
fonts:
  # filename: {
  #   category, package, family,
  #   style, weight-name, weight, stretch
  #   formats: {
  #     format: {path, extension},
  #     ...
  #   },
  # }

  # Source Code Pro
  SourceCodePro-Regular: {
    category: monospace, package: source-code-pro, family: Source Code,
    style: normal, weight-name: normal, weight: 400, stretch: normal,
    formats: {
      woff2: {path: WOFF2/OTF/, extension: otf.woff2},
    },
  }
  SourceCodePro-It: {
    category: monospace, package: source-code-pro, family: Source Code,
    style: italic, weight-name: normal, weight: 400, stretch: normal,
    formats: {
      woff2: {path: WOFF2/OTF/, extension: otf.woff2},
    },
  }
  SourceCodePro-Semibold: {
    category: monospace, package: source-code-pro, family: Source Code,
    style: normal, weight-name: semibold, weight: 600, stretch: normal,
    formats: {
      woff2: {path: WOFF2/OTF/, extension: otf.woff2},
    },
  }
  SourceCodePro-SemiboldIt: {
    category: monospace, package: source-code-pro, family: Source Code,
    style: italic, weight-name: semibold, weight: 600, stretch: normal,
    formats: {
      woff2: {path: WOFF2/OTF/, extension: otf.woff2},
    },
  }
  SourceCodePro-Bold: {
    category: monospace, package: source-code-pro, family: Source Code,
    style: normal, weight-name: bold, weight: 700, stretch: normal,
    formats: {
      woff2: {path: WOFF2/OTF/, extension: otf.woff2},
    },
  }
  SourceCodePro-BoldIt: {
    category: monospace, package: source-code-pro, family: Source Code,
    style: italic, weight-name: bold, weight: 700, stretch: normal,
    formats: {
      woff2: {path: WOFF2/OTF/, extension: otf.woff2},
    },
  }

